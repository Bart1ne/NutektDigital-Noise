name: Build NOISELAB for Korg NTS-3
on:
  push:
    branches: [nts3-noiselab]
    paths:
      - 'nts3/**'
      - '.github/workflows/build-nts3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi make
      - name: Fetch official Korg SDK
        run: |
          git clone --recurse-submodules --depth 1 https://github.com/korginc/logue-sdk.git /tmp/logue-sdk
          test -f /tmp/logue-sdk/platform/nts-3_kaoss/dummy-genericfx/Makefile
      - name: Build unified NOISELAB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -R "nts3/NOISELAB" "/tmp/logue-sdk/platform/nts-3_kaoss/NOISELAB"
          (
            cd "/tmp/logue-sdk/platform/nts-3_kaoss/NOISELAB"
            make GCC_BIN_PATH=/usr/bin
            make install GCC_BIN_PATH=/usr/bin
          )
          cp "/tmp/logue-sdk/platform/nts-3_kaoss/NOISELAB/noiselab.nts3unit" "dist/NOISELAB.nts3unit"
          test -s dist/NOISELAB.nts3unit
          arm-none-eabi-readelf -h dist/NOISELAB.nts3unit | grep ARM
      - uses: actions/upload-artifact@v4
        with:
          name: NOISELAB-UNIFIED-v1
          path: dist/*.nts3unit
          if-no-files-found: error
          retention-days: 30
